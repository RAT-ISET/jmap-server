[package]
name = "admin"
version = "0.1.0"
edition = "2024"

[dependencies]
jmap-core.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.19"
clap = "4.6.5"
